apiVersion: loki.grafana.com/v1
kind: RulerConfig
metadata:
  name: observatorium-lokistack
  namespace: rhobs-int
spec:
  alertmanager:
    enableV2: true
    endpoints:
    - http://alertmanager-0.alertmanager-cluster.rhobs-int.svc.cluster.local:9093
    - http://alertmanager-1.alertmanager-cluster.rhobs-int.svc.cluster.local:9093
    relabelConfigs:
    - sourceLabels:
      - tenantId
      targetLabel: tenant_id
    - action: labeldrop
      regex: tenantId
      sourceLabels: []
status: {}
