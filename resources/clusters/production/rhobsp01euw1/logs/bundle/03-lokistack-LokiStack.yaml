apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: observatorium-lokistack
  namespace: rhobs-production
spec:
  limits:
    global:
      ingestion:
        ingestionBurstSize: 256
        ingestionRate: 160
        maxLineSize: 2097152
        perStreamRateLimit: 120
        perStreamRateLimitBurst: 240
      otlp:
        streamLabels:
          resourceAttributes:
          - name: k8s.namespace.name
          - name: openshift.label.cluster_name
          - name: openshift.log.source
          - name: openshift.log.type
      queries:
        queryTimeout: 5m
      retention:
        days: 90
  managementState: Managed
  rules:
    enabled: false
  size: 1x.extra-small
  storage:
    schemas:
    - effectiveDate: "2025-06-06"
      version: v13
    secret:
      name: loki-default-bucket
      type: s3
  storageClassName: gp3-csi
  template:
    distributor:
      replicas: 6
    ingester:
      replicas: 12
    querier:
      replicas: 2
    queryFrontend:
      replicas: 2
status:
  components: {}
  storage: {}
