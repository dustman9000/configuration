apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: observatorium-lokistack
  namespace: rhobs-production
spec:
  limits:
    global:
      ingestion:
        ingestionBurstSize: 256
        ingestionRate: 250
        maxGlobalStreamsPerTenant: 30000
        maxLineSize: 2097152
        perStreamRateLimit: 240
        perStreamRateLimitBurst: 480
      otlp:
        streamLabels:
          resourceAttributes:
          - name: k8s.namespace.name
          - name: openshift.label.cluster_name
          - name: openshift.log.source
          - name: openshift.log.type
      queries:
        queryTimeout: 5m
      retention:
        days: 90
  managementState: Managed
  rules:
    enabled: false
  size: 1x.extra-small
  storage:
    schemas:
    - effectiveDate: "2025-06-06"
      version: v13
    secret:
      name: loki-default-bucket
      type: s3
  storageClassName: gp3-csi
  template:
    distributor:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: distributor
              app.kubernetes.io/created-by: observatorium-lokistack
          topologyKey: kubernetes.io/hostname
      replicas: 9
    ingester:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: ingester
              app.kubernetes.io/created-by: observatorium-lokistack
          topologyKey: kubernetes.io/hostname
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: thanos-receive-ingester
          topologyKey: kubernetes.io/hostname
      replicas: 9
    querier:
      replicas: 2
    queryFrontend:
      replicas: 2
status:
  components: {}
  storage: {}
