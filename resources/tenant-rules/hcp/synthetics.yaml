apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-hcp-synthetics-rules
  annotations:
    description: "Template for deploying RHOBS synthetic monitoring alerting rules"
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the rules to
    required: true
  - name: TENANT
    description: Tenant to deploy the rules to
    required: true
objects:
  # Route-Monitor-Operator health alerts
  # RMO runs on MCs and its metrics are remote-written to RHOBS cells
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: rhobs-synthetics-rmo
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: rhobs-synthetics-rmo
          interval: 1m
          rules:
            - alert: RMOAPIRequestErrorRate
              expr: |
                (
                  rate(rhobs_route_monitor_operator_api_requests_total{status="error"}[10m])
                  /
                  rate(rhobs_route_monitor_operator_api_requests_total[10m])
                ) > 0.5
              for: 15m
              labels:
                severity: soaking
                service: rhobs-synthetics
              annotations:
                summary: "RMO on {{ $labels.mc_name }} has high RHOBS API error rate"
                description: "Route-monitor-operator on MC {{ $labels.mc_name }} ({{ $labels.region }}) has >50% API request error rate for 15 minutes."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOAPIRequestErrorRate.md"
            - alert: RMOOIDCTokenRefreshFailures
              expr: |
                rate(rhobs_route_monitor_operator_oidc_token_refresh_total{status="error"}[10m]) > 0
                unless
                rate(rhobs_route_monitor_operator_oidc_token_refresh_total{status="success"}[10m]) > 0
              for: 15m
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: "RMO on {{ $labels.mc_name }} cannot refresh OIDC tokens"
                description: "Route-monitor-operator on MC {{ $labels.mc_name }} ({{ $labels.region }}) has had no successful OIDC token refreshes for 15 minutes. Probe lifecycle operations will fail."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOOIDCTokenRefreshFailures.md"
            - alert: RMOProbeDeletionTimeout
              expr: increase(rhobs_route_monitor_operator_probe_deletion_timeout_total[1h]) > 0
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: "RMO on {{ $labels.mc_name }} had probe deletion timeouts"
                description: "Route-monitor-operator on MC {{ $labels.mc_name }} ({{ $labels.region }}) triggered fail-open behavior during probe deletion. Orphaned probes may exist and require manual cleanup."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOProbeDeletionTimeout.md"
            # Only fire if RMO metrics were recently present (proves RMO is
            # deployed in this region). Avoids false positives in regions
            # where RMO hasn't been rolled out yet.
            - alert: RMOMetricsAbsent
              expr: |
                (absent(rhobs_route_monitor_operator_info) == 1)
                unless
                (absent_over_time(rhobs_route_monitor_operator_info[1h]) == 1)
              for: 30m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: "RMO metrics are absent from all MCs"
                description: "No route-monitor-operator metrics have been received from any MC for 30 minutes, but metrics were present within the last hour. The RMO may have stopped running or MC metric collection may be broken."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOMetricsAbsent.md"

  
