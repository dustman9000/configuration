apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-hcp-observability-rules
  annotations:
    description: "Template for deploying HCP observability rules to RHOBS (watchdog, prometheus targets)"
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the rules to
    required: true
  - name: TENANT
    description: Tenant to deploy the rules to
    required: true
objects:
  # Watchdog and HCPWatchdogDown
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: watchdog
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: watchdog
          interval: 30s
          rules:
            # This alert fires when the `watchdog` heartbeat metric for a specific `_id` is missing.
            # If this fires, alerts for the referenced `_id` are not processing, meaning that
            # other alerts for that _id are not able to fire and a loss of observability has occurred.
            - alert: HCPWatchdogDown
              annotations:
                summary: "No `watchdog` heartbeat for {{ $labels._id }} detected"
                description: "No `watchdog` heartbeat for {{ $labels._id }} detected. This means the alerting stack is not functioning properly and alerts may not fire."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/HCPWatchdogDown.md"
              expr: sum by (_id, _mc_id, region, sector) (vector(1)) unless on (_id) (watchdog or hypershift_cluster_alerts_disabled)
                unless on (_id) sre:hcp:alerts_suppressed
              for: 15m
              labels:
                severity: critical
            # Recording rule for watchdog heartbeat
            - record: watchdog
              expr: vector(1)
            # Recording rule that combines all alert suppression conditions.
            # Use `unless on (_id) sre:hcp:alerts_suppressed` in alert expressions
            # instead of listing individual suppression metrics.
            # Conditions:
            #   - hypershift_cluster_alerts_disabled: cluster is in limited support, deleting, or silenced
            #   - hypershift_cluster_waiting_initial_avaibility_duration_seconds: cluster is installing
            - record: sre:hcp:alerts_suppressed
              expr: hypershift_cluster_waiting_initial_avaibility_duration_seconds or hypershift_cluster_alerts_disabled
            # Recording rule for synthetics-agent probes (external API path, customer experience).
            # Uses apiserver_url label (synthetics-agent external probes use this label).
            # Use `and on (_id) sre:hcp:probe_active` in synthetics-based alert expressions.
            - record: sre:hcp:probe_active
              expr: |
                (
                  sum by (_id) (count_over_time(probe_success{apiserver_url=~".*api.*"}[10m])) > 0
                )
                and
                (
                  max by (_id) (max_over_time(probe_success{apiserver_url=~".*api.*"}[1h])) > 0
                )
            # Recording rule for RMO blackbox probes (internal kube-apiserver service path).
            # Uses probe_url label (RMO blackbox exporter uses this label).
            # Use `and on (_id) sre:hcp:blackbox_probe_active` in blackbox-based alert expressions.
            - record: sre:hcp:blackbox_probe_active
              expr: |
                (
                  sum by (_id) (count_over_time(probe_success{probe_url=~".*api.*"}[10m])) > 0
                )
                and
                (
                  max by (_id) (max_over_time(probe_success{probe_url=~".*api.*"}[1h])) > 0
                )
  # Prometheus target health alerts - ServiceMonitors and PodMonitors
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-prometheus-target-alerting
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-prometheus-target-alerting
          interval: 1m
          rules:
            - alert: HCPPrometheusPodMonitorDown
              # Gate on hypershift_cluster_vcpus to avoid firing for deleted clusters
              # whose HCP namespace still exists on the MC (SREP-4071)
              expr: ((sre:hcp_podmonitor_up:sum{name!~".*karpenter"} == 0) and on (_id) hypershift_cluster_vcpus) unless on (_id) sre:hcp:alerts_suppressed
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: "PodMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} is down."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/HCPPrometheusPodMonitorDown.md"
                description: "PodMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} has been down for 30m."
            # Until https://issues.redhat.com/browse/OCPBUGS-55399 is resolved, node-tuning-operator metrics do not work in HyperShift
            # Until https://issues.redhat.com/browse/OCPBUGS-62851 is resolved, cluster-version-operator metrics do not work in HyperShift
            # Until https://issues.redhat.com/browse/OCPBUGS-76270 is resolved, olm-operator & catalog-operator metrics do not work in HyperShift
            # Until <BUG_NEEDED> is resolved, ovnkube-control-plane metrics do not work in HyperShift
            # hypershift_cluster_waiting_initial_avaibility_duration_seconds is used to not alert in case the cluster is in installing state.
            - alert: HCPPrometheusServiceMonitorDown
              # Gate on hypershift_cluster_vcpus to avoid firing for deleted clusters
              # whose HCP namespace still exists on the MC (SREP-4071)
              expr: ((sre:hcp_servicemonitor_up:sum{name!~"node-tuning-operator|ovnkube-control-plane|cluster-version-operator|olm-operator-metrics|catalog-operator-metrics"} == 0) and on (_id) hypershift_cluster_vcpus) unless on (_id) sre:hcp:alerts_suppressed
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: "ServiceMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} is down."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/HCPPrometheusServiceMonitorDown.md"
                description: "ServiceMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} has been down for 30m."
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: metrics-ingestion
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: metrics-ingestion
          interval: 1m
          rules:
            - alert: NoMetricReceived
              expr: absent({env=~"${ENVIRONMENT}",region=~"${REGION}",_mc_id!="",mc_name!="",is_global!="true"})
              for: 30m
              labels:
                severity: warning
                env: ${ENVIRONMENT}
                region: ${REGION}
              annotations:
                summary: "No metric received for environment {{ $labels.environment }} in region {{ $labels.region }}."
                runbook_url: "https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/NoMetricReceived.md"
                description: "Environment {{ $labels.environment }} in region {{ $labels.region }} has received no metrics from any management cluster for the last 30m."
