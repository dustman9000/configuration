apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-hcp-loki-recording-rules
  annotations:
    description: Template for deploying HCP Loki RecordingRules to RHOBS
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the rules to
    required: true
  - name: TENANT
    description: Loki tenant ID for rule evaluation
    required: true
  - name: REGION
    description: Region where the RHOBS cell is deployed
    required: false
    value: .+
  - name: ENVIRONMENT
    description: Environment where the RHOBS cell is deployed
    required: false
    value: .+
objects:
  - apiVersion: loki.grafana.com/v1
    kind: RecordingRule
    metadata:
      name: cluster-provisioning-events
      namespace: ${NAMESPACE}
      labels:
        loki.grafana.com/loki-rule: "true"
    spec:
      tenantID: ${TENANT}
      groups:
        - name: rosa_hcp_provisioning_events
          interval: 5m
          rules:
            - record: sre:rosa_hcp:provisioning_it1_events:count5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT1" [5m]))
            - record: sre:rosa_hcp:provisioning_it2_events:count5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT2" |= "Kind: 'ManifestWork'" |= "Operation: 'Create'" [5m]))
            - record: sre:rosa_hcp:provisioning_it3_events:count5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT3" [5m]))
            - record: sre:rosa_hcp:provisioning_it4_events:count5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT4" [5m]))
            - record: sre:rosa_hcp:provisioning_it5_events:count5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT5" [5m]))
            - record: sre:rosa_hcp:provisioning_it6_events:count5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT6" [5m]))
            - record: sre:rosa_hcp:provisioning_it7_events:count5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT7" [5m]))
            - record: sre:rosa_hcp:provisioning_completion_rate:ratio5m
              expr: |
                sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT7" [5m]))
                /
                (sum(count_over_time({kubernetes_namespace_name=~"uhc-production|uhc-stage|uhc-integration"} |= "ROSA HCP - IT1" [5m])) > 0)
